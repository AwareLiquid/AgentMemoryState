name: External reproduction evidence

on:
  pull_request:
    paths:
      - ".github/workflows/external-reproduction.yml"
      - "scripts/external-reproduction-gate.mjs"
      - "evidence/external-reproductions/**"
      - "docs/interop/external-reproduction.md"
      - "package.json"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: external-reproduction-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reproduce:
    name: R-002 independent reproduction
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate evidence manifest
        run: node scripts/external-reproduction-gate.mjs --validate-only
      - name: Run pinned external reproductions
        run: >-
          node scripts/external-reproduction-gate.mjs
          --output artifacts/external-reproductions/${{ github.sha }}
      - name: Upload external reproduction record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erc-8350-external-reproduction-${{ github.run_id }}
          path: artifacts/external-reproductions/
          if-no-files-found: error
          retention-days: 90

  notify:
    name: Trusted reproduction failure notification
    needs: reproduce
    if: >-
      always() &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (needs.reproduce.result == 'failure' || needs.reproduce.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or resolve one regression issue
        uses: actions/github-script@v7
        env:
          REPRODUCTION_RESULT: ${{ needs.reproduce.result }}
        with:
          script: |
            const title = '[CI] External reproduction regression';
            const marker = '<!-- erc8350-external-reproduction-monitor -->';
            const repo = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...repo, state: 'open', per_page: 100
            });
            const existing = issues.find(i => !i.pull_request && i.title === title &&
              i.user?.login === 'github-actions[bot]' && i.body?.includes(marker));
            const url = `${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${context.runId}`;
            if (process.env.REPRODUCTION_RESULT === 'failure') {
              const body = `${marker}\nThe trusted external reproduction gate failed.\n\n` +
                `Run: ${url}\nCommit: ${context.sha}\n\n` +
                'Inspect both suite logs and preserve the failing evidence. Do not claim R-002 is currently passing. ' +
                'This monitor is separate from G4 security acceptance.';
              if (existing) {
                await github.rest.issues.update({...repo, issue_number: existing.number, body});
              } else {
                await github.rest.issues.create({...repo, title, body});
              }
            } else if (existing) {
              await github.rest.issues.createComment({...repo, issue_number: existing.number,
                body: `Recovery verified by the trusted two-suite gate: ${url}\nCommit: ${context.sha}`});
              await github.rest.issues.update({...repo, issue_number: existing.number,
                state: 'closed', state_reason: 'completed'});
            }
