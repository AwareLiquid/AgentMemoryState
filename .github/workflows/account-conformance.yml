name: Real account authorization conformance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accounts:
    name: Real EIP-7702 and Safe authorization
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: node scripts/account-conformance.mjs
      - name: Upload exact account evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-conformance-${{ github.sha }}
          path: artifacts/account-conformance/
          if-no-files-found: error
