[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib", "../contracts/lib"]
remappings = ["project/=../contracts/", "forge-std/=../contracts/lib/forge-std/src/", "safe/=lib/safe/contracts/", "erc8350-assets/=../erc/assets/erc-8350/"]
allow_paths = ["../contracts", "../erc/assets/erc-8350"]
solc = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
fs_permissions = [{access = "read", path = "../contracts/out"}, {access = "read", path = "../test-vectors"}]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
